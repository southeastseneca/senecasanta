<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seneca Santa Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Nunito+Sans:ital,opsz,wdth,wght@0,6..12,75..125,200..1000;1,6..12,75..125,200..1000&family=Nunito:wght@400..900&display=swap">
<style>
/* Layout: the flyer, unfolded into a phone-first scroll. Green ground, cream cards, red callouts. Single theme on purpose: it matches the printed piece. */
:root{
  --green:#10865a; --green-deep:#0c6e49; --red:#9e181b; --cream:#f7f0ca;
  --gold:#c99c44; --ink:#434c43; --sun:#f6c026; --white:#fffdf3;
  --f-script:"Leckerli One","Brush Script MT",cursive;
  --f-caps:"Nunito Sans","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito Sans","Arial Narrow",system-ui,sans-serif;
  --f-round:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--green);color:var(--cream);font-family:var(--f-body);font-size:18px;line-height:1.35}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:36px}

/* Thank-you banner (shown when Stripe sends people back) */
.thanks{background:var(--cream);color:var(--ink);border:4px solid var(--gold);border-radius:32px;padding:20px 24px;text-align:center;display:flex;flex-direction:column;gap:6px}
.thanks h2{margin:0;font-family:var(--f-script);font-weight:400;color:var(--red);font-size:clamp(2rem,6vw,3rem);line-height:1}
.thanks p{margin:0;font-size:1.1rem}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:20px;align-items:center}
.hero-art img.santa{width:100%;max-width:420px;display:block;animation:bob 4s ease-in-out infinite;transform-origin:50% 100%}
.hero-text{text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.title{position:relative;display:inline-block;margin:0 auto}
.title img.spark{position:absolute;width:clamp(34px,6vw,58px);left:-15%;top:-38%;transform:rotate(15deg)}
.share{width:100%;background:var(--red);border:3px solid var(--gold);border-radius:28px;padding:18px clamp(18px,4vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.share img{width:clamp(40px,7vw,60px);transform:rotate(-12deg)}
.share h3{margin:0 0 4px;font-family:var(--f-caps);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(1rem,2.4vw,1.35rem);letter-spacing:.03em;line-height:1.05;color:var(--cream)}
.share p{margin:0;font-size:clamp(1rem,2.2vw,1.15rem);line-height:1.25}
.share b{color:var(--sun)}
h1{margin:0;font-family:var(--f-script);font-weight:400;font-size:clamp(3rem,9vw,6rem);line-height:1;color:var(--cream);
  text-shadow:3px 3px 0 var(--red),-1px -1px 0 var(--red),1px -1px 0 var(--red),-1px 1px 0 var(--red);letter-spacing:.01em}
.kicker{margin:0;font-family:var(--f-caps);font-weight:900;text-transform:uppercase;color:var(--gold);font-size:clamp(1.6rem,4.6vw,3rem);letter-spacing:.06em;line-height:1}
.lede{margin:10px auto 0;max-width:24ch;font-weight:500;font-size:clamp(1.3rem,3vw,2rem);line-height:1.08;text-wrap:balance}

.clock{background:var(--red);border:3px solid var(--gold);border-radius:999px;padding:22px clamp(20px,5vw,56px);text-align:center;font-style:italic;font-weight:300;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.2;text-wrap:balance;margin:0}
.clock b{font-weight:700}

/* Form steps */
form{display:flex;flex-direction:column;gap:30px;margin:0}
.step{display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;align-items:center;gap:14px}
.num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--red);display:grid;place-items:center;font-family:var(--f-caps);font-weight:900;font-size:1.4rem}
.step-head h2{margin:0;font-family:var(--f-caps);font-weight:800;text-transform:uppercase;font-size:clamp(1.1rem,3vw,1.7rem);line-height:1.05;letter-spacing:.03em;text-wrap:balance}
.step-head img{width:44px;flex:none;transform:rotate(15deg)}

/* Level cards as radio buttons */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{position:relative;cursor:pointer;display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center;gap:6px;color:var(--ink);background:var(--cream);border:4px solid var(--red);border-radius:32px;padding:18px 12px 16px;text-align:center;transition:transform .18s ease,box-shadow .18s ease}
.card input{position:absolute;opacity:0;pointer-events:none}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card:has(input:checked){box-shadow:0 0 0 5px var(--sun),0 10px 0 5px var(--green-deep);transform:translateY(-4px)}
.card:has(input:focus-visible){outline:4px solid var(--sun);outline-offset:6px}
.price{font-family:var(--f-caps);font-weight:900;color:var(--red);font-size:clamp(2rem,4.4vw,2.9rem);line-height:1;letter-spacing:-.01em}
.name{font-weight:600;font-size:1.1rem;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em;min-height:2.2em;display:flex;align-items:center}
.card .art{height:120px;display:flex;align-items:center;justify-content:center}
.card .art img{max-height:120px;width:auto;max-width:100%}
.pick{margin-top:6px;font-family:var(--f-caps);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cream);background:var(--red);border-radius:999px;padding:9px 16px;white-space:nowrap}
.pick::after{content:"Pick me"}
.card:has(input:checked) .pick{background:var(--green)}
.card:has(input:checked) .pick::after{content:"Picked \2713"}

.custom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--cream);color:var(--ink);border:4px solid var(--red);border-radius:32px;padding:14px 22px;cursor:pointer}
.custom:has(input[type=radio]:checked){box-shadow:0 0 0 5px var(--sun)}
.custom input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.custom img{width:56px}
.custom h3{margin:0;font-family:var(--f-caps);font-weight:900;color:var(--red);text-transform:uppercase;font-size:clamp(1.05rem,2.4vw,1.45rem);line-height:1}
.custom p{margin:4px 0 0;font-size:1rem;line-height:1.2}
.money{display:flex;align-items:center;background:var(--white);border:3px solid var(--red);border-radius:999px;padding:4px 16px;font-family:var(--f-caps);font-weight:900;font-size:1.5rem;color:var(--red)}
.money input{width:4ch;border:0;background:transparent;font:inherit;color:inherit;outline:none;-moz-appearance:textfield}
.money input::-webkit-outer-spin-button,.money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money:focus-within{outline:4px solid var(--sun);outline-offset:2px}

/* Fields */
.panel{background:var(--cream);color:var(--ink);border-radius:28px;padding:20px clamp(16px,3vw,26px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-family:var(--f-caps);font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.field small{font-size:.92rem;color:var(--ink);opacity:.85}
select,input[type=text],input[type=url],input[type=tel],input[type=email],textarea{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--white);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;min-width:0}
textarea{min-height:96px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:3px solid var(--sun);outline-offset:1px;border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:2px solid var(--green);background:transparent;color:var(--green-deep);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{background:var(--green);color:var(--cream)}
.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.count{align-self:flex-end;font-size:.85rem;opacity:.75;font-variant-numeric:tabular-nums}

/* Send button */
.send{display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{font-family:var(--f-caps);font-weight:900;font-size:clamp(1.1rem,3vw,1.5rem);text-transform:uppercase;letter-spacing:.06em;color:var(--cream);background:var(--red);border:4px solid var(--gold);border-radius:999px;padding:18px 40px;cursor:pointer;box-shadow:0 8px 0 var(--green-deep);transition:transform .12s ease,box-shadow .12s ease;max-width:100%}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--green-deep)}
.btn:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.btn[disabled]{opacity:.7;cursor:wait}
.fine{margin:0;font-size:.98rem;text-align:center;max-width:46ch}
.err{margin:0;background:var(--cream);color:var(--red);border-radius:14px;padding:10px 16px;font-weight:600;text-align:center}

/* How to + opt out */
.how{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.how h2{margin:0 0 14px;font-family:var(--f-script);font-weight:400;color:var(--red);font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;
  text-shadow:-1px -1px 0 var(--cream),1px -1px 0 var(--cream),-1px 1px 0 var(--cream),1px 1px 0 var(--cream)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;font-family:var(--f-caps);font-weight:700;text-transform:uppercase;font-size:clamp(.92rem,1.9vw,1.1rem);line-height:1.1;letter-spacing:.02em}
.steps li::before{counter-increment:s;content:counter(s);width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.optout{background:var(--red);border-radius:36px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.optout h3{margin:0;font-family:var(--f-caps);font-weight:800;text-transform:uppercase;font-size:1.25rem;line-height:1;letter-spacing:.03em}
.optout p{margin:0;font-family:var(--f-caps);font-weight:700;font-size:.85rem;line-height:1.15}
.optout .field label{color:var(--cream);text-align:left}
.optout select,.optout input{border-color:var(--cream)}
.ghost{align-self:center;font-family:var(--f-caps);font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red);background:var(--cream);border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.ghost:hover{background:var(--sun)}
.ghost:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.foot{text-align:center;font-weight:500;font-size:1rem;opacity:.95;margin:0}
.foot b{font-family:var(--f-caps);font-weight:800;letter-spacing:.03em}

/* Britt's type system: Leckerli One script, Nunito Sans Expanded caps, condensed Nunito Sans body, Nunito for form text */
body{font-stretch:75%}
.kicker,.step-head h2,.price,.pick,.custom h3,.money,.field label,.btn,.steps li,.optout h3,.optout p,.ghost,.foot b,.num{font-family:var(--f-caps);font-stretch:125%}
.name{font-stretch:75%;font-weight:700}
.clock{font-weight:300}
select,input[type=text],input[type=url],input[type=tel],input[type=email],textarea,.chip,.fine,.thanks p,.field small,.count,.err{font-family:var(--f-round);font-stretch:normal}
h1,.how h2,.thanks h2{letter-spacing:0}

/* Goal bars */
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.goal{background:var(--cream);color:var(--ink);border:4px solid var(--red);border-radius:28px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.goal img{grid-row:1/3;height:62px;width:auto}
.goal h3{margin:0;font-family:var(--f-caps);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(.9rem,2vw,1.05rem);letter-spacing:.04em;color:var(--red);line-height:1.05}
.goal .raised{margin:0;font-family:var(--f-round);font-size:1rem;font-variant-numeric:tabular-nums}
.goal .raised b{font-family:var(--f-caps);font-stretch:125%;font-weight:900;font-size:1.35rem;color:var(--green-deep)}
.track{grid-column:1/-1;height:24px;background:var(--white);border:3px solid var(--gold);border-radius:999px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;border-radius:999px;transition:width 1.4s cubic-bezier(.2,.8,.2,1);background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#b82024 12px 24px)}
.goal.community .fill{background:repeating-linear-gradient(-45deg,var(--green) 0 12px,var(--green-deep) 12px 24px)}
.goal .meta{grid-column:1/-1;margin:2px 0 0;display:flex;justify-content:space-between;gap:8px;font-family:var(--f-round);font-size:.88rem;opacity:.85;font-variant-numeric:tabular-nums}
@media (max-width:700px){.goals{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
@media (prefers-reduced-motion:reduce){.hero-art img.santa{animation:none}.card,.btn{transition:none}}

@media (max-width:820px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .how{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art img.santa{max-width:190px;margin:0 auto}
  .title img.spark{left:-6%;top:-34%}
  .clock{border-radius:32px}
  .card{border-radius:26px;padding:14px 8px}
  .card .art{height:88px}.card .art img{max-height:88px}
  .name{font-size:.95rem}
  .pick{font-size:.68rem;padding:8px 12px}
  .custom{grid-template-columns:auto minmax(0,1fr);padding:14px 16px}
  .money{grid-column:1/-1;justify-self:center}
  .panel{grid-template-columns:minmax(0,1fr)}
  .btn{width:100%;padding:18px 20px}
}
</style>
</head>
<body style="margin:0">

<main class="wrap" style="padding-block:16px;gap:0">
<section class="goals" aria-label="Fundraising progress">
    <div class="goal business">
      <img src="santa-small.png" alt="">
      <h3>Businesses passing the Claus</h3>
      <p class="raised"><b id="biz-raised">$0</b> raised</p>
      <div class="track" role="progressbar" aria-label="Business donations toward goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="biz-track"><div class="fill" id="biz-fill"></div></div>
      <p class="meta"><span id="biz-gifts">0 donations</span><span id="biz-goal">Goal $10,000</span></p>
    </div>
    <div class="goal community">
      <img src="tree.png" alt="">
      <h3>Community cheer</h3>
      <p class="raised"><b id="pub-raised">$0</b> raised</p>
      <div class="track" role="progressbar" aria-label="Community donations toward goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pub-track"><div class="fill" id="pub-fill"></div></div>
      <p class="meta"><span id="pub-gifts">0 donors</span><span id="pub-goal">Goal $10,000</span></p>
    </div>
  </section>
</main>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKLCWHl2MmmGTY6Vkk8c4g0IWkeHbTmQUIFcuP2WXt4YKqOZqsmsqN4v2kzoqbXAmPDw/exec"; // same /exec URL as the other pages
// Goal bars: live totals from the tracker sheet
(function(){
  const money = n => "$" + Math.round(n).toLocaleString("en-US");
  function paint(key, raised, goal, gifts, noun){
    const pct = goal ? Math.min(100, raised / goal * 100) : 0;
    document.getElementById(key + "-raised").textContent = money(raised);
    document.getElementById(key + "-goal").textContent = "Goal " + money(goal);
    document.getElementById(key + "-gifts").textContent = gifts + " " + noun + (gifts === 1 ? "" : "s");
    document.getElementById(key + "-track").setAttribute("aria-valuenow", Math.round(pct));
    requestAnimationFrame(() => { document.getElementById(key + "-fill").style.width = Math.max(pct, raised ? 3 : 0) + "%"; });
  }
  async function load(){
    if (!APPS_SCRIPT_URL) return;
    try {
      const d = await fetch(APPS_SCRIPT_URL + "?totals=1").then(r => r.json());
      paint("biz", d.business, d.goalBusiness, d.bizGifts, "donation");
      paint("pub", d.public, d.goalPublic, d.pubGifts, "donor");
    } catch (e) {}
  }
  load(); setInterval(load, 120000);
})();

function postHeight(){ try { parent.postMessage({ ssHeight: Math.ceil(document.body.getBoundingClientRect().height) }, "*"); } catch (e) {} }
if (window.parent !== window){ window.addEventListener("load", postHeight); window.addEventListener("resize", postHeight);
  if ("ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.body); }
</script>
</body>
</html>
